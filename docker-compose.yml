version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: linkeflow-postgres
    environment:
      POSTGRES_USER: linkeflow
      POSTGRES_PASSWORD: linkeflow_password
      POSTGRES_DB: linkeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkeflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for Celery broker and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: linkeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Application
  api:
    build: .
    container_name: linkeflow-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://linkeflow:linkeflow_password@postgres:5432/linkeflow
      - REDIS_URL=redis://redis:6379/0
      # Canonical names (code reads these). Legacy aliases still work but prefer these.
      - JWT_SECRET=your_jwt_secret_key_here
      - CREDENTIAL_ENCRYPTION_KEY=your_64_char_hex_key_here
      - JWT_SECRET_KEY=your_jwt_secret_key_here
      - ENCRYPTION_KEY=your_64_char_hex_key_here
      - JWT_ALGORITHM=HS256
      - RESEND_API_KEY=your_resend_api_key_here
      - PASSWORD_RESET_URL=http://localhost:5173/reset-password
      - BACKEND_CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - FROM_EMAIL=noreply@example.com
      # Social post scheduler OAuth. Set these in the .env file next to this
      # compose file (compose substitutes ${VAR:-0} with .env values). A
      # platform with empty credentials is reported as "not configured" and
      # its connect button is disabled — nothing else breaks.
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      - INSTAGRAM_REDIRECT_URI=${INSTAGRAM_REDIRECT_URI:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - FACEBOOK_REDIRECT_URI=${FACEBOOK_REDIRECT_URI:-}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads/social}
      - SOCIAL_OAUTH_RETURN_URL=${SOCIAL_OAUTH_RETURN_URL:-}
      # Instagram Reels: stream the stored file to Meta instead of handing it
      # a video_url (see docs/running_locally.md → Instagram publishing).
      - INSTAGRAM_DIRECT_UPLOAD=${INSTAGRAM_DIRECT_UPLOAD:-true}
      # AI copy extraction (POST /api/v1/social-scheduler/parse-copy). The
      # key is read by the API only — never exposed to the frontend. Left
      # empty, the endpoint answers 503 and the upload page keeps its own
      # local parser. Only the api service needs it (the worker never calls
      # Groq).
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      # Every feature (Beat, scheduled campaigns, recurring scans) is on by
      # default in ALL environments, including the public hosted instance
      # (ENVIRONMENT=deployment). Timers can be switched off per deployment
      # with SCHEDULED_JOBS_ENABLED=false plus RUN_BEAT=0.
      - ENVIRONMENT=production
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload --log-level info

  # Celery Worker
  worker:
    build: .
    container_name: linkeflow-worker
    environment: &celery_environment
      - DATABASE_URL=postgresql+asyncpg://linkeflow:linkeflow_password@postgres:5432/linkeflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=your_jwt_secret_key_here
      - CREDENTIAL_ENCRYPTION_KEY=your_64_char_hex_key_here
      - JWT_SECRET_KEY=your_jwt_secret_key_here
      - ENCRYPTION_KEY=your_64_char_hex_key_here
      - JWT_ALGORITHM=HS256
      - RESEND_API_KEY=your_resend_api_key_here
      - PASSWORD_RESET_URL=http://localhost:5173/reset-password
      - BACKEND_CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - FROM_EMAIL=noreply@example.com
      # Worker refreshes stored tokens (YouTube/TikTok) and needs the same
      # OAuth app credentials as the API. Values come from .env.
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID:-}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET:-}
      - YOUTUBE_REDIRECT_URI=${YOUTUBE_REDIRECT_URI:-}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID:-}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET:-}
      - INSTAGRAM_REDIRECT_URI=${INSTAGRAM_REDIRECT_URI:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - FACEBOOK_REDIRECT_URI=${FACEBOOK_REDIRECT_URI:-}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY:-}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET:-}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads/social}
      - SOCIAL_OAUTH_RETURN_URL=${SOCIAL_OAUTH_RETURN_URL:-}
      # The worker does the publishing, so it needs the same upload flag.
      - INSTAGRAM_DIRECT_UPLOAD=${INSTAGRAM_DIRECT_UPLOAD:-true}
      - ENVIRONMENT=production
    depends_on: &celery_dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: &application_volume
      - .:/app
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2

  # Beat is required for delayed campaign steps. It reads next_action_at every
  # minute and queues an account session when a lead becomes due.
  beat:
    build: .
    container_name: linkeflow-beat
    environment: *celery_environment
    depends_on: *celery_dependencies
    volumes: *application_volume
    command: celery -A worker.celery_app beat --loglevel=info --schedule=/tmp/linkeasy-celerybeat-schedule

volumes:
  postgres_data:
  redis_data:

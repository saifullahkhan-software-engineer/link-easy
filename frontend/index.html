<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary metadata — this is what link previews (LinkedIn, WhatsApp, X, Slack...) use -->
    <title>LinkEasy — Automate Your Daily Tasks</title>
    <meta
      name="description"
      content="LinkEasy automates your daily tasks — schedule short videos to YouTube, Instagram, TikTok & Facebook, run LinkedIn outreach, and monitor WhatsApp leads from one dashboard."
    />

    <!-- Open Graph (LinkedIn, Facebook, WhatsApp, Slack, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkEasy" />
    <meta property="og:url" content="https://link-easy-coral.vercel.app/" />
    <meta property="og:title" content="LinkEasy — Automate Your Daily Tasks" />
    <meta
      property="og:description"
      content="Connect your tools. Automate your day. Schedule short videos, run LinkedIn outreach, and monitor WhatsApp leads from one dashboard."
    />
    <meta property="og:image" content="https://link-easy-coral.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://link-easy-coral.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LinkEasy — Automate Your Daily Tasks" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LinkEasy — Automate Your Daily Tasks" />
    <meta
      name="twitter:description"
      content="Connect your tools. Automate your day. Schedule short videos, run LinkedIn outreach, and monitor WhatsApp leads from one dashboard."
    />
    <meta name="twitter:image" content="https://link-easy-coral.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

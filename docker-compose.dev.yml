version: '3.8'

services:
  # Redis (for Celery broker and rate limiting) - Local Development
  redis:
    image: redis:7-alpine
    container_name: linkeflow-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
